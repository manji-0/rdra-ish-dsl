name: Verus
# `codegen --lang rust --verus` (experimental, docs/design/verus.md): the codegen_verus tests
# with Verus on PATH, so the generated crates are checked, not skipped. Verus and the Rust
# toolchain it runs on are installed here, beside the flake's devShell, which does not change:
# the release is pinned to the one the generator's output names (VERUS_RELEASE in
# crates/rdra-ish-emit/src/codegen/verus/mod.rs). Runs on main once a day, by hand
# (`gh workflow run verus.yml --ref <branch>`), and on a pull request that touches the
# code generators (the Verus crate reads their IR), its tests, or this file. The main CI runs the same tests without Verus, where the
# Verus ones print `skipped:`.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - crates/rdra-ish-emit/src/codegen/**
      - crates/rdra-ish-cli/tests/codegen_verus.rs
      - crates/rdra-ish-cli/tests/fixtures/verus/**
      - .github/workflows/verus.yml

env:
  CARGO_TERM_COLOR: always
  VERUS_RELEASE: 0.2026.11.22.1ce6a59
  VERUS_TOOLCHAIN: 1.100.0

jobs:
  verus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: the pinned release is the one the generator names
        shell: bash
        run: |
          grep -q "VERUS_RELEASE: &str = \"$VERUS_RELEASE\"" crates/rdra-ish-emit/src/codegen/verus/mod.rs
          grep -q "VERUS_TOOLCHAIN: &str = \"$VERUS_TOOLCHAIN\"" crates/rdra-ish-emit/src/codegen/verus/mod.rs
      - name: install Verus and its toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # rustup is on the runner. The wrapper puts rustup's toolchain first for Verus alone,
        # so the devShell's cargo still builds rdra-ish.
        run: |
          dir="$RUNNER_TEMP/verus"
          mkdir -p "$dir" "$RUNNER_TEMP/bin"
          gh release download "release/$VERUS_RELEASE" --repo verus-lang/verus \
            --pattern "verus-$VERUS_RELEASE-x86-linux.zip" --dir "$dir"
          unzip -q "$dir/verus-$VERUS_RELEASE-x86-linux.zip" -d "$dir"
          rustup toolchain install "$VERUS_TOOLCHAIN" --profile minimal
          cat > "$RUNNER_TEMP/bin/verus" <<EOF
          #!/bin/sh
          export PATH="$HOME/.cargo/bin:\$PATH"
          exec "$dir/verus-x86-linux/verus" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/verus"
          "$RUNNER_TEMP/bin/verus" --version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verus
      - name: codegen_verus with Verus
        shell: nix develop --command bash -eo pipefail {0}
        env:
          RDRA_REQUIRE_VERUS: "1"
        run: cargo test -p rdra-ish-cli --test codegen_verus -- --test-threads 2
