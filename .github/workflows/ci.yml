name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # Every step runs inside the flake devShell (toolchain, TLC, Java).
    shell: nix develop --command bash -eo pipefail {0}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        # These run in release in formal-verify and engine-equivalence; in debug they take most
        # of this step.
        run: >-
          cargo test --all --
          --skip bfs_and_tlc_reach_the_same_states_and_verdicts
          --skip reduced_domain_cones_decide_what_the_cones_decide
          --skip a_property_cone_decides_what_the_whole_model_decides
          --skip bfs_and_tlc_agree_on_a_sub_lifecycle_of_many_classes
          --skip bfs_and_tlc_agree_on_two_actions_of_one_name
      - name: sample artifact snapshots
        run: bash scripts/check-sample-artifacts.sh
      - name: skill snippets
        # Debug binary; its verify transcripts need the devShell's tlc.
        run: |
          cargo build -p rdra-ish-cli
          python3 -I scripts/check-skill-snippets.py target/debug/rdra-ish

  formal-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p rdra-ish-cli --release
      - name: Check and verify every sample against its expect header
        run: scripts/verify-samples.sh target/release/rdra-ish
        timeout-minutes: 20
      - name: A reduced cone decides what its cone decides on the domain samples
        run: cargo test --release -p rdra-ish-core --lib reduced_domain_cones_decide_what_the_cones_decide
      - name: Reduced and unreduced verify agree on random models
        # Quick seeds of a local sweep: reduced cones, timers, chooses, split use cases and
        # 3 instances among them. A seed that slows past the timeout fails the step.
        run: >-
          python3 -I scripts/reduction-diff.py run target/release/rdra-ish --fail-on-timeout
          --seeds 0,2,4,7,8,13,15,18,22,23,27,31,32,38,39,41,45,46,47,49,52,53,55,57,59,188,244,417,419,459,496
        timeout-minutes: 10

  engine-equivalence:
    # The longest check; a job of its own so it runs beside formal-verify.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: Lifecycle BFS and TLC agree on every sample
        run: RDRA_REQUIRE_TLC=1 cargo test --release -p rdra-ish-cli --test engine_equivalence
