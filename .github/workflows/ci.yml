name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # Every step runs inside the flake devShell (toolchain, TLC, Java).
    shell: nix develop --command bash -eo pipefail {0}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        # scripts/diff-test.sh holds the tests this step skips: the comparisons with TLC and z3
        # run in release in engine-equivalence, and the domain-sample reduction in formal-verify.
        # RDRA_REQUIRE_CODEGEN_TOOLS: the devShell has tsc and go, so the codegen build tests
        # may not skip a language here; portability.yml runs without them and skips.
        run: RDRA_REQUIRE_CODEGEN_TOOLS=1 scripts/diff-test.sh --all
      - name: sample artifact snapshots
        run: bash scripts/check-sample-artifacts.sh
      - name: skill snippets
        # Debug binary; a verify transcript with --with-tlc needs the devShell's tlc.
        run: |
          cargo build -p rdra-ish-cli
          python3 -I scripts/check-skill-snippets.py target/debug/rdra-ish
      - name: nix package
        # The package `nix profile install github:manji-0/rdra-ish-dsl` installs.
        run: nix build -L && ./result/bin/rdra-ish --help >/dev/null && test -x ./result/bin/rdra-ish-lsp

  formal-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p rdra-ish-cli --release
      - name: Check and verify every sample against its expect header, with no JVM
        # The script takes tlc and tlc2 off PATH and unsets RDRA_TLC_JAR, and fails when tlc
        # is still found, so every run here is the native checker alone.
        run: scripts/verify-samples.sh target/release/rdra-ish
        timeout-minutes: 20
      - name: The same, with TLC beside the native checker (--with-tlc)
        # Each verify run must match its header, print tlc_result:, and report no
        # error[EngineDisagreement], which would add a name the header does not list.
        run: scripts/verify-samples.sh --with-tlc target/release/rdra-ish
        timeout-minutes: 20
      - name: A reduced cone decides what its cone decides on the domain samples
        run: cargo test --release -p rdra-ish-core --lib reduced_domain_cones_decide_what_the_cones_decide
      - name: The reduced-unreduced comparison gets each saved output pair right
        run: python3 -I scripts/reduction-diff.py selfcheck
      - name: Reduced and unreduced verify agree on random models, and TLC agrees with both
        # Quick seeds of a local sweep: reduced cones, timers, chooses, split use cases and
        # 3 instances among them; 78 to 127 raise events and reduce a cone whose
        # sub-lifecycle reads inputs of T. --with-tlc runs TLC beside the native checker and
        # fails a seed the engines decide differently. A seed that slows past the timeout
        # fails the step.
        run: >-
          python3 -I scripts/reduction-diff.py run target/release/rdra-ish --fail-on-timeout --with-tlc
          --seeds 0,2,4,7,8,13,15,18,22,23,27,31,32,38,39,41,45,46,47,49,52,53,55,57,59,188,244,417,419,459,496,78,79,86,88,89,92,95,99,100,109,113,114,125,127
        timeout-minutes: 10

  engine-equivalence:
    # The longest check; a job of its own so it runs beside formal-verify.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: Lifecycle BFS and TLC agree on every sample
        run: RDRA_REQUIRE_TLC=1 cargo test --release -p rdra-ish-cli --test engine_equivalence
      - name: No rule z3 proves has a BFS counterexample at 1 to 3 instances
        run: RDRA_REQUIRE_Z3=1 cargo test --release -p rdra-ish-cli --test proof_equivalence
      - name: The adversarial corpus gives its stated verdicts, and native, TLC and z3 agree on it
        # docs/engine-agreement.md: each case under crates/rdra-ish-cli/tests/engine_corpus/
        # states every engine's verdict; about 25 s locally.
        run: RDRA_REQUIRE_TLC=1 RDRA_REQUIRE_Z3=1 cargo test --release -p rdra-ish-cli --test engine_corpus
