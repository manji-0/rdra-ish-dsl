name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # Every step runs inside the flake devShell (toolchain, TLC, Java).
    shell: nix develop --command bash -eo pipefail {0}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        # The whole-sample engine comparison and the domain-sample reduction run in release in
        # formal-verify.
        run: >-
          cargo test --all --
          --skip bfs_and_tlc_reach_the_same_states_and_verdicts
          --skip reduced_domain_cones_decide_what_the_cones_decide
      - name: sample artifact snapshots
        run: bash scripts/check-sample-artifacts.sh
      - name: skill snippets
        # Debug binary; its verify transcripts need the devShell's tlc.
        run: |
          cargo build -p rdra-ish-cli
          python3 -I scripts/check-skill-snippets.py target/debug/rdra-ish

  formal-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p rdra-ish-cli --release
      - name: Check and verify every sample against its expect header
        run: scripts/verify-samples.sh target/release/rdra-ish
        timeout-minutes: 20
      - name: A reduced cone decides what its cone decides on the domain samples
        run: cargo test --release -p rdra-ish-core --lib reduced_domain_cones_decide_what_the_cones_decide
      - name: Lifecycle BFS and TLC agree on every sample
        run: RDRA_REQUIRE_TLC=1 cargo test --release -p rdra-ish-cli --test engine_equivalence
