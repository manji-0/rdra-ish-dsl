name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # Every step runs inside the flake devShell (toolchain, TLC, Java).
    shell: nix develop --command bash -eo pipefail {0}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all
      - name: sample artifact snapshots
        run: bash scripts/check-sample-artifacts.sh
      - name: sample model check
        run: |
          cargo build -p rdra-ish-cli --release
          BIN=./target/release/rdra-ish
          for sample in \
            samples/ec-site \
            samples/clinic-ops \
            samples/personal-info \
            samples/api-contract \
            samples/incremental-order/step-6-business-rules/src \
            samples/formal-verification/order.rdra
          do
            echo "==> check $sample"
            "$BIN" check "$sample"
          done
          # int_stock intentionally uses TLA-only Int comparison (UndrivenComparisonProp).
          echo "==> expect state error on int_stock (TLA-only comparison)"
          set +e
          out=$("$BIN" check samples/formal-verification/int_stock.rdra 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [[ $rc -eq 0 ]]; then
            echo "expected non-zero check for int_stock (undriven Int comparison)" >&2
            exit 1
          fi
          if ! grep -q "comparison proposition" <<<"$out"; then
            echo "expected undriven comparison fingerprint for int_stock" >&2
            exit 1
          fi
          echo "==> check --allow-tla-only int_stock (mixed-model escape hatch)"
          "$BIN" check samples/formal-verification/int_stock.rdra --allow-tla-only

  formal-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p rdra-ish-cli --release
      - name: Export + verify pass samples
        run: |
          BIN=./target/release/rdra-ish
          # order.rdra: states + TLA both green
          echo "==> check/export/verify samples/formal-verification/order.rdra"
          "$BIN" check samples/formal-verification/order.rdra
          "$BIN" export samples/formal-verification/order.rdra --kind tla -o /tmp/rdra-ci-tla
          set +e
          out=$("$BIN" verify samples/formal-verification/order.rdra --backend tlc -o /tmp/rdra-ci-tla 2>&1)
          status=$?
          set -e
          echo "$out"
          if [[ $status -ne 0 ]]; then
            echo "expected TLC pass for order.rdra" >&2
            exit 1
          fi
          if ! grep -q "tlc_result: ok" <<<"$out"; then
            echo "expected tlc_result: ok for order.rdra" >&2
            exit 1
          fi
          # int_stock: Int comparison is TLA-only; skip check, require TLC pass
          echo "==> export/verify samples/formal-verification/int_stock.rdra (TLA-only comparison)"
          "$BIN" export samples/formal-verification/int_stock.rdra --kind tla -o /tmp/rdra-ci-tla
          set +e
          out=$("$BIN" verify samples/formal-verification/int_stock.rdra --backend tlc -o /tmp/rdra-ci-tla 2>&1)
          status=$?
          set -e
          echo "$out"
          if [[ $status -ne 0 ]]; then
            echo "expected TLC pass for int_stock.rdra" >&2
            exit 1
          fi
          if ! grep -q "tlc_result: ok" <<<"$out"; then
            echo "expected tlc_result: ok for int_stock.rdra" >&2
            exit 1
          fi
          # cross_order_payment: Pay is one atomic action over the linked Order and Payment.
          echo "==> verify samples/formal-verification/cross_order_payment.rdra (atomic Pay)"
          set +e
          out=$("$BIN" verify samples/formal-verification/cross_order_payment.rdra --backend tlc -o /tmp/rdra-ci-tla 2>&1)
          status=$?
          set -e
          echo "$out"
          if [[ $status -ne 0 ]] || ! grep -q "tlc_result: ok" <<<"$out"; then
            echo "expected tlc_result: ok for cross_order_payment.rdra" >&2
            exit 1
          fi
      - name: Verify fail samples report TLC counterexample
        run: |
          BIN=./target/release/rdra-ish
          for sample in \
            samples/formal-verification/quantifier_none.rdra \
            samples/formal-verification/now_coupon.rdra \
            samples/formal-verification/untriggered_sets.rdra \
            samples/formal-verification/after_assert_unmet.rdra
          do
            echo "==> expect TLC counterexample: $sample"
            set +e
            out=$("$BIN" verify "$sample" --backend tlc -o /tmp/rdra-ci-tla-fail 2>&1)
            status=$?
            set -e
            echo "$out"
            if [[ $status -eq 0 ]]; then
              echo "expected TLC failure for $sample" >&2
              exit 1
            fi
            if ! grep -q "tlc_result: counterexample" <<<"$out"; then
              echo "expected tlc_result: counterexample for $sample (not tool_error); got:" >&2
              echo "$out" >&2
              exit 1
            fi
            if ! grep -qiE "invariant.*violated|property.*violated|Error:.*violated" <<<"$out"; then
              echo "expected TLC-native violation fingerprint for $sample" >&2
              exit 1
            fi
          done
