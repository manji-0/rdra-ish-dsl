name: CI
on:
  # main is checked every three hours, not on every merge: a scheduled run whose commit the
  # last finished run on main, scheduled or by hand, already checked is skipped (see
  # `changes`). GitHub may start a scheduled run hours late or drop it under load. Start one by hand with
  # `gh workflow run ci.yml --ref main`.
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  pull_request:
    # labeled/unlabeled: adding or removing `no-verify` decides the verification jobs again.
    types: [opened, synchronize, reopened, labeled, unlabeled]

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # Every step runs inside the flake devShell (toolchain, TLC, Java).
    shell: nix develop --command bash -eo pipefail {0}

jobs:
  changes:
    # Whether the pull request can change a verification result: formal-verify and
    # engine-equivalence run only then. scripts/verify-relevant.sh lists the paths that
    # cannot (prose, the editor and LSP, codegen, the diagram and data-layer exports). The
    # label `no-verify` skips them for a change a reviewer judged unable to reach them, such
    # as help text. A run on main (scheduled or by hand) runs every job. `kani` says whether the change can reach
    # a Kani harness (scripts/kani-relevant.sh); the label does not skip it. `code` is false
    # when every changed file is prose (scripts/code-relevant.sh): `check` then runs the
    # checks that read prose instead of its whole test suite and the sample artifacts. `nix`
    # says whether the change can break the nix package while cargo still builds: the flake
    # takes the whole repository as its source, so only its own files, the manifests, the
    # lock file and this workflow can. `codegen` says whether the change touches the codegen
    # printers, the subcommand, their tests, or the models the domain-sample differential
    # test reads (the five domain samples' .rdra files and samples.txt): `check` then runs
    # the slow tests of the codegen_* binaries too. `lean` says whether the change touches the
    # Lean proofs, their check script or this workflow: the `lean` job then checks them.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      verify: ${{ steps.decide.outputs.verify }}
      kani: ${{ steps.decide.outputs.kani }}
      code: ${{ steps.decide.outputs.code }}
      codegen: ${{ steps.decide.outputs.codegen }}
      nix: ${{ steps.decide.outputs.nix }}
      lean: ${{ steps.decide.outputs.lean }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NO_VERIFY: ${{ contains(github.event.pull_request.labels.*.name, 'no-verify') }}
        # On a pull request HEAD is its merge into the base, so HEAD^1 is the base.
        run: |
          run=true
          if [ "$EVENT" = schedule ]; then
            # Skip when the last run on main that finished, scheduled or started by hand,
            # checked this same commit. A cancelled run does not count, so its commit is
            # checked again.
            last=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=20" \
              --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")
                     | select(.conclusion == "success" or .conclusion == "failure")][0] | "\(.head_sha) \(.id)"' || true)
            if [ "${last%% *}" = "$GITHUB_SHA" ]; then
              echo "main is still $GITHUB_SHA, which run ${last##* } checked; skipping"
              run=false
            fi
          fi
          if [ "$run" = false ]; then
            verify=false
            kani=false
            code=false
            codegen=false
            nix=false
            lean=false
          elif [ "$EVENT" != pull_request ]; then
            verify=true
            kani=true
            code=true
            codegen=true
            nix=true
            lean=true
          else
            git diff --name-only --no-renames HEAD^1 HEAD | tee changed.txt
            kani=$(scripts/kani-relevant.sh < changed.txt)
            code=$(scripts/code-relevant.sh < changed.txt)
            if grep -qE '^(flake\.(nix|lock)|Cargo\.(toml|lock)|crates/[^/]+/Cargo\.toml|\.github/workflows/ci\.yml)$' changed.txt; then
              nix=true
            else
              nix=false
            fi
            # The models of the five domain samples and samples.txt too: the slow
            # printed_code_agrees_on_the_domain_samples reads them, and a change there would
            # otherwise first fail on main.
            if grep -qE '^crates/rdra-ish-emit/src/codegen/|^crates/rdra-ish-cli/src/codegen_cmd\.rs$|^crates/rdra-ish-cli/tests/(codegen_|fixtures/codegen/)|^samples/(clinic-ops|patent-ops|food-permit-ops|insurance-claim-ops|oidc-auth)/.*\.rdra$|^samples\.txt$' changed.txt; then
              codegen=true
            else
              codegen=false
            fi
            if grep -qE '^proofs/lean/|^scripts/check-lean-proofs\.sh$|^\.github/workflows/ci\.yml$' changed.txt; then
              lean=true
            else
              lean=false
            fi
            if [ "$NO_VERIFY" = true ]; then
              verify=false
            else
              verify=$(scripts/verify-relevant.sh < changed.txt)
            fi
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
          echo "verify=$verify" | tee -a "$GITHUB_OUTPUT"
          echo "kani=$kani" | tee -a "$GITHUB_OUTPUT"
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "codegen=$codegen" | tee -a "$GITHUB_OUTPUT"
          echo "nix=$nix" | tee -a "$GITHUB_OUTPUT"
          echo "lean=$lean" | tee -a "$GITHUB_OUTPUT"

  check:
    needs: changes
    # Runs whatever `changes` concluded: if it failed, `code` is empty and every step runs.
    # A skipped job reports success, so skipping this one would read as passed. No check
    # is required by branch protection (the repository has none); the PR's checks are the
    # merge gate by convention. A scheduled run of a commit already checked skips it.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        if: needs.changes.outputs.code != 'false'
        # scripts/diff-test.sh holds the tests every step here skips: the comparisons with TLC
        # and z3 run in release in engine-equivalence, and the domain-sample reduction in
        # formal-verify. The `pr` profile of .config/nextest.toml also skips the tests that take
        # over 10 s on the runner; `slow tests` below runs them on main. rdra-ish-cli's
        # diagram_contract binary runs here, on every event, through `cargo test` in one
        # process (about 35 s), not under nextest (diff-test.sh).
        # The one exception by path: a pull request that touches the codegen printers, the
        # codegen subcommand, the codegen tests or the domain samples' models (`codegen`
        # above) also runs the slow tests of the codegen_* binaries, where a printer bug shows.
        # RDRA_REQUIRE_CODEGEN_TOOLS: the devShell has tsc and go, so the codegen build tests
        # may not skip a language here; portability.yml runs without them and skips. For the
        # same reason RDRA_REQUIRE_TLC, RDRA_REQUIRE_Z3 and RDRA_REQUIRE_SQLITE turn the skips
        # of verify_cli, prove_cli and sql_cli into failures: a devShell that lost tlc, z3 or
        # python3's sqlite3 would otherwise pass those tests without running them.
        env:
          EVENT: ${{ github.event_name }}
          CODEGEN: ${{ needs.changes.outputs.codegen }}
        run: |
          also=()
          if [ "$EVENT" = pull_request ] && [ "$CODEGEN" != false ]; then
            also=(--filter 'default() | binary_id(rdra-ish-cli::codegen_*)')
          fi
          RDRA_REQUIRE_CODEGEN_TOOLS=1 RDRA_REQUIRE_TLC=1 RDRA_REQUIRE_Z3=1 RDRA_REQUIRE_SQLITE=1 \
            scripts/diff-test.sh --profile pr "${also[@]}" --all
      - name: debug CLI
        # The binary the test step built (cargo-nextest builds it for the CLI tests), for
        # the two steps below: a no-op after the test step, a build in prose mode. A separate
        # `cargo build -p rdra-ish-cli` resolves other features and compiled every crate again.
        run: cargo test --all --no-run --quiet
      - name: sample artifact snapshots
        if: needs.changes.outputs.code != 'false'
        # The script writes the same files with a debug or a release binary. Since #285 no
        # row explores the lifecycle only to print a note, so debug costs minutes, not the
        # 15-21 it did, and saves the release build `nix build` made from scratch here.
        run: bash scripts/check-sample-artifacts.sh target/debug/rdra-ish
      - name: prose checks
        # In place of the two steps above when every changed file is prose: the tests that read
        # Markdown. The rule ids in docs/language-reference.md and
        # docs/rdra-ish-interpretation.md, the stage blocks in README.md, docs/, skills/ and
        # samples/, and the lifecycle-error table in docs/cli-reference.md. The skill snippets
        # step below checks skills/ either way.
        if: needs.changes.outputs.code == 'false'
        run: |
          cargo test -p rdra-ish-core --lib -- --exact rdra_rules::tests::rule_ids_are_unique_and_in_the_docs refinement::docs::tests::stage_docs_are_in_sync
          cargo test -p rdra-ish-cli --test export_gate
      - name: skill snippets
        # Debug binary; a verify transcript with --with-tlc needs the devShell's tlc.
        run: python3 -I scripts/check-skill-snippets.py target/debug/rdra-ish
      - name: Int-bound sites of Lemma U
        # The places that read the Int bound against the list under Lemma U in
        # docs/theory/z3.md. Text only, so it runs on prose and code changes alike.
        run: python3 -I scripts/check-int-bound-sites.py
      - name: Lean proofs' references
        # The Rust and Lean names that proofs/lean/README.md, the Lean doc comments and the
        # Lean-citing lines of docs/theory/claims.md and cones.md cite, against crates/ and
        # proofs/lean (and CheckAxioms.lean). Text only, so it runs on prose and code alike:
        # a rename in crates/ breaks it as surely as an edit to the README.
        run: python3 -I scripts/check-lean-refs.py
      - name: nix package
        # The package `nix profile install github:manji-0/rdra-ish-dsl` installs. A release
        # build from scratch (about 4.5 minutes), so only when `nix` says a change can break it
        # while cargo builds, and on every run on main.
        if: needs.changes.outputs.nix != 'false'
        run: nix build -L && ./result/bin/rdra-ish --help >/dev/null && test -x ./result/bin/rdra-ish-lsp
      - name: slow tests
        # On main (scheduled or by hand), the tests the test step's `pr` profile skips: the
        # `slow` profile inherits its list as `default()`. --nextest-only: the test step ran
        # diagram_contract and the doctests already.
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name != 'pull_request' }}
        run: |
          RDRA_REQUIRE_CODEGEN_TOOLS=1 RDRA_REQUIRE_TLC=1 RDRA_REQUIRE_Z3=1 RDRA_REQUIRE_SQLITE=1 \
            scripts/diff-test.sh --profile slow --filter 'not default()' --nextest-only --all
      - name: no test a pull request runs takes over 10 s
        # On main, from the test step's times: a test past 10 s fails the run until it joins
        # the `pr` profile's list in .config/nextest.toml or gets faster. A warning would scroll
        # by unread; the red run is what keeps the list true.
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name != 'pull_request' }}
        run: python3 -I scripts/check-test-times.py target/nextest/pr/junit.xml 10
      - name: test times
        # Each test's time, target/nextest/{pr,slow}/junit.xml.
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: junit
          path: target/nextest/*/junit.xml
          if-no-files-found: ignore

  formal-verify:
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p rdra-ish-cli --profile ci-checked
      - name: The same, with TLC beside the native checker (--with-tlc)
        # Every header line runs, each must match its header. TLC runs beside the native
        # checker on the roots scripts/tlc-roots.txt lists and on every header line with
        # flags (#305); such a run must also print tlc_result: and report no
        # error[EngineDisagreement]. engine_equivalence compares every other root's cones
        # with TLC's state graph. The run with no JVM on PATH is the shadow job's.
        run: scripts/verify-samples.sh --with-tlc --tlc-roots scripts/tlc-roots.txt target/ci-checked/rdra-ish
        timeout-minutes: 20
      - name: A reduced cone decides what its cone decides on the domain samples
        run: |
          cargo test --profile ci-checked -p rdra-ish-core --lib reduced_domain_cones_decide_what_the_cones_decide
          cargo test --profile ci-checked -p rdra-ish-core --lib reduced_domain_cones_hold_each_fold_bit_where_its_action_runs
          cargo test --profile ci-checked -p rdra-ish-core --lib reduced_domain_cones_step_by_a_true_fold_bit_only_where_the_cone_steps
          cargo test --profile ci-checked -p rdra-ish-core --lib case_fold_bits_hold_exactly_where_their_actions_run_past_slot_0
          cargo test --profile ci-checked -p rdra-ish-core --lib reduced_cones_step_as_their_cones_step
      - name: Each group rule has a witness, and the cost caps keep the verdict
        # The witnesses run in the debug test step too, but for the one that enumerates up
        # to BRANCH_CAP arrangements a state, which takes minutes there. The snapshot of the
        # group rules is the witness of the rules kept without one of their own; it runs
        # here alone: about 3 s in release, a minute in debug.
        run: cargo test --profile ci-checked -p rdra-ish-core --lib -- symmetry::witnesses symmetry::snapshot
      - name: The reduced-unreduced comparison gets each saved output pair right
        run: python3 -I scripts/reduction-diff.py selfcheck
      - name: Reduced and unreduced verify agree on random models, and TLC agrees with both
        # On a pull request, the 522 seeds scripts/reduction-diff-pr-seeds.txt lists, without
        # TLC: the native reduced and unreduced runs alone take about a minute, so a PR
        # compares many more models than the 45 TLC seeds (#305). On main (scheduled
        # or by hand), quick seeds of a local sweep with --with-tlc, which runs TLC beside the
        # native checker and fails a seed the engines decide differently: reduced cones,
        # timers, chooses, split use cases and 3 instances among them; 78 to 127 raise events
        # and reduce a cone whose sub-lifecycle reads inputs of T. Those take 7 to 9 minutes
        # on the runner, all but seconds of it TLC. A seed past the timeout fails the step, as
        # does a seed whose model does not load (a generator left behind by a syntax change)
        # and a run that compared or reduced fewer seeds than its floor: on 2026-11-25 the PR
        # seeds compared 522 and reduced a cone in 284, the main seeds 45 and 33. The floors
        # sit well below, to catch a run that went empty, not to pin the counts.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 -I scripts/reduction-diff.py run target/ci-checked/rdra-ish --fail-on-timeout \
              --min-compared 500 --min-reduced 200 --seeds @scripts/reduction-diff-pr-seeds.txt
          else
            python3 -I scripts/reduction-diff.py run target/ci-checked/rdra-ish --fail-on-timeout --with-tlc \
              --min-compared 40 --min-reduced 20 \
              --seeds 0,2,4,7,8,13,15,18,22,23,27,31,32,38,39,41,45,46,47,49,52,53,55,57,59,188,244,417,419,459,496,78,79,86,88,89,92,95,99,100,109,113,114,125,127
          fi
        timeout-minutes: 20
      - name: Every reduced cone of the random models steps as its cone steps (Lemma 6)
        # The 522 PR seeds, on both events: each seed's reduced cones whose unreduced cone
        # completes, checked step by step against it (core/reduce/lemma6.rs) by the ignored
        # core test the script drives; about 2 minutes locally, 361 of the seeds reduce a cone.
        run: |
          python3 -I scripts/reduction-diff.py lemma6 --profile ci-checked --min-reduced 300 \
            --seeds @scripts/reduction-diff-pr-seeds.txt
        timeout-minutes: 15
      - id: elan
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-4.3.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('proofs/lean/lean-toolchain') }}
      - name: Install elan
        if: steps.elan.outputs.cache-hit != 'true'
        run: curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.3.0/elan-init.sh | sh -s -- -y --default-toolchain none
      - name: Every top-level split of the samples and the corpus passes the Lean-checked Lemma 5
        # scripts/check-lean-certificates.sh dumps each split `split_with` returns (the ignored
        # core test `dump_lemma5_certificates`, built with ci-checked as the Lemma 6 step built
        # it), builds the checker whose soundness proofs/lean/RdraIsh/Lemma5Check.lean proves,
        # runs it, and sees each planted fault rejected. Only elan's wrappers go on PATH: the
        # toolchain's own bin holds a clang and a linker that break cargo's link.
        run: PATH="$HOME/.elan/bin:$PATH" scripts/check-lean-certificates.sh --profile ci-checked
        timeout-minutes: 10
      - name: Reduced and unreduced verify agree on random models with params on a stub
        # `--stubs` draws models whose reduction binds a param on a stub to any slot
        # (`bind_stub_params`, claims A8 and T9): a folded S action's `Triggered` param, and a
        # rise's `Parent`, `Existing` or `Triggered` param. Of the seeds above, one PR seed
        # draws the first and none the second. The seeds are the 95 of 0 to 99 that took at
        # most 1.5 s in a local sweep; they take seconds, without TLC, on a pull request and on
        # main. With the rebind dropped (`RDRA_ISH_DROP_RULE=bind_stub_params`, a `shadow`
        # build), the stub check flags 89 of them as `disagreed`; with that check off as well,
        # 82 diverge. The floors fail a run whose models stopped reaching the shapes: on
        # 2026-11-28 the seeds compared 95, all reduced a cone, 68 bound a fold's param on a
        # stub and 57 a rise's.
        run: |
          python3 -I scripts/reduction-diff.py --work target/reduction-diff-stubs run target/ci-checked/rdra-ish \
            --stubs --fail-on-timeout --seeds 0:25,26:31,32:45,46:68,69:74,75:100 \
            --min-compared 90 --min-reduced 85 --min-stub-fold 50 --min-stub-rise 40
        timeout-minutes: 10

  engine-equivalence:
    # The longest check; a job of its own so it runs beside formal-verify.
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: Lifecycle BFS and TLC agree on every sample
        # RDRA_REQUIRE_TLC_BATCH: the TLC runs of up to 5,000 states go through the batch
        # JVMs (#310, the flake's `tlc-batch`), and the test fails when one of them falls
        # back to a process of its own, which would otherwise only show as a slower job.
        run: RDRA_REQUIRE_TLC=1 RDRA_REQUIRE_TLC_BATCH=1 cargo test --profile ci-checked -p rdra-ish-cli --test engine_equivalence
      - name: No rule z3 proves has a BFS counterexample at 1 to 3 instances
        run: RDRA_REQUIRE_Z3=1 cargo test --profile ci-checked -p rdra-ish-cli --test proof_equivalence
      - name: The adversarial corpus gives its stated verdicts, and native, TLC and z3 agree on it
        # docs/engine-agreement.md: each case under crates/rdra-ish-cli/tests/engine_corpus/
        # states every engine's verdict; about 45 s locally.
        run: RDRA_REQUIRE_TLC=1 RDRA_REQUIRE_Z3=1 cargo test --profile ci-checked -p rdra-ish-cli --test engine_corpus

  tlc-batch-both:
    # On main only (scheduled or by hand): engine_equivalence once more with every TLC job
    # run in a batch JVM and again as a process with the same fingerprint and seed, failing on
    # any difference (docs/engine-agreement.md, "Batch JVMs"). It doubles the TLC work of the
    # sample comparison, so it is a job of its own beside engine-equivalence, not a step of it.
    needs: changes
    if: ${{ needs.changes.outputs.verify == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: A batch JVM gives what a TLC process of its own gives (RDRA_TLC_BATCH=both)
        run: RDRA_REQUIRE_TLC=1 RDRA_REQUIRE_TLC_BATCH=1 RDRA_TLC_BATCH=both cargo test --profile ci-checked -p rdra-ish-cli --test engine_equivalence
        timeout-minutes: 65

  shadow:
    # Every fast function that has a reference twin checked against the twin on every call
    # (#275): the `shadow` build of the CLI over the samples and the engine corpus. A fast
    # path that returns what its twin does not panics with the call's name. A job of its own
    # beside formal-verify and engine-equivalence, gated as they are.
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: Build the shadow CLI
        # Through the corpus test's build, so the last step finds it built: a separate
        # `cargo build` resolves other features and compiled every crate a second time.
        run: cargo test --profile ci-checked -p rdra-ish-cli --features shadow --test engine_corpus --no-run
      - name: Every twin compares calls
        # How many calls each twin compared and skipped on ten runs. `verify` of patent-ops
        # reaches every twin but `Fold::holds`, which quantifier_guard reaches, a shared run
        # of S, which `verify` of clinic-ops reaches, the two that read entity views, which no
        # run of `verify` gathers (#251): `check` does, and the ends of an after-assert step on
        # a run without an edge list, which safety_edge_free_cone reaches (#296). The other
        # `verify` runs take `--symmetry always`, which the instance-symmetry twins (#212)
        # need, the test-only `RDRA_ISH_FORCE_ORBITS`, which runs up to symmetry each cone a
        # plain run of the entity pass would decide, and the test-only
        # `RDRA_ISH_FORCE_S_UP_TO_H`, which runs each sub-lifecycle up to `H` at once: no
        # sample's stops at the memory limit at these bounds. clinic-ops is where `H` moves
        # rows of a sub-lifecycle the `s_up_to_h` twin can hold. The last three runs hold the
        # per-binding liveness reader (`orbit_liveness`, #212 phase 4) to its twin on fair
        # properties that fail: an orbit self-edge loop, the `FirstAbsent` asymmetry, and a
        # key that moves. The variables change nothing without `--symmetry`. The step fails
        # when a line is missing (a build without the feature) or a twin compared none in all
        # ten. The tenth runs clinic-ops with the BFS workers probing (#296 item 3.1 part 2).
        # Each line counts `compared/skipped/stopped` per twin: a call skipped over the twin's
        # cap, or stopped at a limit of the run, passed unchecked (claim T14 of
        # docs/theory/claims.md), so the step fails on such a call in a run and twin
        # `expected_skips` does not name. The fourth run is the path a release build takes
        # (workers that do not probe): the twins of that path must compare calls there, and
        # the probe twins (`hit`, `recent`) none but in the tenth (claim N4).
        run: |
          for run in "verify samples/patent-ops --symmetry always" \
                     "verify samples/clinic-ops --symmetry always" \
                     "verify samples/formal-verification/quantifier_guard.rdra --symmetry always" \
                     "verify samples/clinic-ops" \
                     "check samples/patent-ops" \
                     "verify crates/rdra-ish-cli/tests/engine_corpus/safety_edge_free_cone.rdra" \
                     "verify crates/rdra-ish-cli/tests/engine_corpus/sym_relink_loop.rdra --instances Ticket=1 --symmetry always" \
                     "verify crates/rdra-ish-cli/tests/engine_corpus/presence_first_absent_asymmetry.rdra --symmetry always" \
                     "verify crates/rdra-ish-cli/tests/engine_corpus/presence_along_key_moves.rdra --symmetry always"; do
            RDRA_ISH_SHADOW_STATS=1 RDRA_ISH_FORCE_ORBITS=1 RDRA_ISH_FORCE_S_UP_TO_H=1 \
              target/ci-checked/rdra-ish $run 2>&1 >/dev/null \
              | grep '^shadow: compared/skipped/stopped ' >> shadow-stats.txt || true
          done
          # The workers of a BFS run probe its shared table (#296 item 3.1 part 2) only under
          # the test-only `RDRA_ISH_FORCE_PROBES`, which a release build never sets: this run
          # holds the probes (`hit`, `recent`) to their twins. The code they check is code a
          # release build does not run.
          RDRA_ISH_SHADOW_STATS=1 RDRA_ISH_FORCE_PROBES=1 target/ci-checked/rdra-ish verify samples/clinic-ops 2>&1 >/dev/null \
            | grep '^shadow: compared/skipped/stopped ' >> shadow-stats.txt || true
          cat shadow-stats.txt
          test "$(wc -l < shadow-stats.txt)" -eq 10
          python3 - <<'EOF'
          import collections, re
          runs = []
          for line in open("shadow-stats.txt"):
              runs.append({twin: tuple(map(int, n)) for twin, *n in
                           re.findall(r"(\w+)=(\d+)/(\d+)/(\d+)", line)})
          compared = collections.Counter()
          for run in runs:
              for twin, (n, _, _) in run.items():
                  compared[twin] += n
          none = [twin for twin, n in compared.items() if n == 0]
          assert compared and not none, f"twins that compared no call: {none}"
          # The calls each run lets through: a sample past a twin's cap of 200,000 states.
          expected_skips = {
              0: {"reduced_orbit_run", "orbit_state_models"},
              1: {"orbit_run", "s_up_to_h", "orbit_state_models"},
          }
          unexpected = [(i + 1, twin, s, t) for i, run in enumerate(runs)
                        for twin, (_, s, t) in run.items()
                        if s + t and twin not in expected_skips.get(i, set())]
          assert not unexpected, f"calls a twin let through (run, twin, skipped, stopped): {unexpected}"
          release = runs[3]
          idle = [t for t in ("each_enabled", "seen", "seen_growth", "same_as", "dense_binding",
                              "packed", "edges") if release[t][0] == 0]
          assert not idle, f"twins of a release build's path that compared nothing there: {idle}"
          probed = [(i + 1, t) for i, run in enumerate(runs[:9]) for t in ("hit", "recent")
                    if run[t][0]]
          assert not probed, f"probe twins that compared calls without probing: {probed}"
          assert runs[9]["hit"][0] and runs[9]["recent"][0], "the probing run probed nothing"
          EOF
      - name: Every sample against its expect header, each fast path held to its twin
        run: scripts/verify-samples.sh target/ci-checked/rdra-ish
        timeout-minutes: 20
      - name: Random models with params on a stub, S up to H, each fast path held to its twin
        # The first 30 quick `--stubs` seeds of formal-verify, reduced against unreduced under
        # `--symmetry always` and the test-only `RDRA_ISH_FORCE_S_UP_TO_H`, so every reduction
        # runs its S up to `H` beside the `s_up_to_h` twin (claims A8, A22, T9). About 10 s;
        # on 2026-11-28 all 30 ran S up to `H`, 18 bound a fold's param on a stub and 16 a rise's.
        run: |
          RDRA_ISH_FORCE_S_UP_TO_H=1 python3 -I scripts/reduction-diff.py --symmetry always \
            --work target/reduction-diff-stubs-h run target/ci-checked/rdra-ish \
            --stubs --fail-on-timeout --seeds 0:25,26:31 \
            --min-compared 30 --min-reduced 28 --min-stub-fold 12 --min-stub-rise 10 --min-up-to-h 28
        timeout-minutes: 10
      - name: The adversarial corpus, each fast path held to its twin
        run: RDRA_REQUIRE_TLC=1 RDRA_REQUIRE_Z3=1 cargo test --profile ci-checked -p rdra-ish-cli --features shadow --test engine_corpus
        timeout-minutes: 20

  kani:
    # The Kani harnesses beside the code they prove (docs/engine-agreement.md#kani-harnesses),
    # when a change can reach one, and on every run on main. Kani is not in nixpkgs, so the
    # job runs on the runner's rustup, outside the devShell: `cargo kani setup` installs the
    # nightly its version pins and links ~/.kani to it, so the cache holds both.
    needs: changes
    if: needs.changes.outputs.kani == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KANI_VERSION: 0.68.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
            ~/.rustup/toolchains/nightly-*
          key: kani-${{ env.KANI_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install Kani
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
      - name: Prove the harnesses
        run: cargo kani -p rdra-ish-core

  lean:
    # The Lean proofs under proofs/lean (proofs/lean/README.md), when a change touches them,
    # and on every run on main. The devShell provides elan. This job still installs elan
    # 4.3.0 itself and stays outside the devShell, so it does not build the shell. The cache
    # holds that elan and the toolchain proofs/lean/lean-toolchain pins, which lake installs
    # on the first build. The proofs import nothing beyond Lean's core, and build in seconds.
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-4.3.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('proofs/lean/lean-toolchain') }}
      - name: Install elan
        if: steps.cache.outputs.cache-hit != 'true'
        run: curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.3.0/elan-init.sh | sh -s -- -y --default-toolchain none
      - name: Build the proofs, with no sorry and no axiom of their own
        run: PATH="$HOME/.elan/bin:$PATH" scripts/check-lean-proofs.sh
