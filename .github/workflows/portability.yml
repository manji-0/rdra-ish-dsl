name: Portability

# Runs the same test step as release.yml on every release OS, with plain stable
# Rust and no nix or TLC, so a tag does not meet a red build for the first time.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: portability-${{ matrix.os }}

      - name: Test
        run: cargo test --workspace --locked
