name: Publish PyPI package

# release.yml dispatches this with the tag once the GitHub release is out; dispatch it by
# hand (`gh workflow run publish-pypi.yml -f ref=vX.Y.Z`) only when that job failed. It has no
# `release: published` trigger: release.yml creates the release with GITHUB_TOKEN, which
# starts no workflow, and a release made by hand would publish a second time.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to publish, for example v2.3.0"
        required: true

permissions:
  contents: read

jobs:
  version:
    # Only a release of rdra-ish itself (a tag v*) publishes (#349). Other releases of this
    # repository, such as the pinned copy of a tool the flake downloads, do not. The tag,
    # Cargo.toml and pyproject.toml must name one version, or nothing is built.
    name: Check the version
    if: ${{ startsWith(inputs.ref, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: The tag, Cargo.toml and pyproject.toml agree
        env:
          TAG: ${{ inputs.ref }}
        run: scripts/check-release-version.sh "$TAG"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: --release --sdist -o dist
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --release -o dist
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --release -o dist

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: ${{ matrix.args }}
          manylinux: auto

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
