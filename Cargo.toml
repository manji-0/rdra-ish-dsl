[workspace]
resolver = "2"
members = [
    "crates/rdra-ish-syntax",
    "crates/rdra-ish-core",
    "crates/rdra-ish-emit",
    "crates/rdra-ish-cli",
    "crates/rdra-ish-lsp",
]

[workspace.package]
edition = "2021"
version = "3.0.0"
authors = ["rdra-ish-dsl contributors"]
license = "MIT"
repository = "https://github.com/manji-0/rdra-ish-dsl"
description = "RDRA-inspired DSL compiler and diagram generator"

[workspace.dependencies]
# parser
logos        = "0.14"
chumsky      = "0.9"
unicode-width = "0.2"
# diagnostics; the CLI turns on `fancy`, whose `backtrace` Kani cannot compile
miette       = { version = "7" }
thiserror    = "2"
# model
slotmap      = "1"
petgraph     = "0.6"
hashbrown    = { version = "0.17", default-features = false }
# emit
csv          = "1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
# cli
clap         = { version = "4", features = ["derive"] }
anyhow       = "1"
# lsp
tower-lsp    = "0.20"
tower-service = "0.3"
tokio        = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
url          = "2"
# file
walkdir      = "2"
toml         = "0.8"
dunce        = "1"
# test
insta        = { version = "1", features = ["toml"] }
tempfile     = "3"

# cargo mutants (.cargo/mutants.toml): release, with incremental builds, since each mutant
# rebuilds only the crate it changed and what depends on it.
# The profile of the CI jobs that verify samples, the corpus and engine agreement: release
# with overflow-checks, so a fixed-width integer that wraps (claims N1 and N2 of
# docs/theory/claims.md) panics there instead of giving a wrong verdict. The release and
# PyPI builds keep `release`, which wraps silently.
[profile.ci-checked]
inherits = "release"
overflow-checks = true

[profile.mutants]
inherits = "release"
incremental = true

# CBMC keeps the fields of an array apart only up to 64 elements by default, and past that it
# does not resolve which variant an enum read from a `Vec`'s buffer is: `rdra-ish-core`'s `reduce/fold.rs`
# harnesses, which read a `TransitionSystem`'s lists, then unwind `eval` through every kind of
# `Pred`: one call of `Fold::holds` took 20 GB. At 1024 it takes 2 GB, and the two harnesses
# 9 GB at most and under two minutes each.
[workspace.metadata.kani]
flags = { cbmc-args = ["--max-field-sensitivity-array-size", "1024"] }
unstable = { unstable-options = true }
