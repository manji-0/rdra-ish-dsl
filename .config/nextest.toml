# cargo-nextest settings for the workspace tests, which scripts/diff-test.sh runs.

[profile.default]
# A SLOW line in the log for each test past 10 s; none is stopped.
slow-timeout = "10s"

[profile.pr]
# CI's check job. On a pull request it runs this profile alone: every test but the ones
# below. On main (scheduled or by hand) it runs this profile, fails when a test of it took
# over 10 s (scripts/check-test-times.py), and then runs the tests below.
#
# Listed: a test that took over 8 s on the runner in a run of this profile, 2 s short of the
# 10 s the check fails at, so that a test near the line does not turn main red at random.
# A test is listed by its binary and its exact name.
#
# rdra-ish-cli's diagram_contract binary is in no profile's run: scripts/diff-test.sh leaves
# it out of every nextest run and runs it whole through `cargo test`, on a pull request and
# on main, where its tests share one load of the samples (about 35 s together). Under
# nextest each would load them again, and nine took over 10 s.
default-filter = """
not (
    (binary_id(rdra-ish-cli::codegen_equivalence) & test(=functions_agree_with_the_transition_system))
  | (binary_id(rdra-ish-cli::codegen_differential) & (
        test(=printed_code_agrees_on_the_domain_samples)
      | test(=printed_code_agrees_on_the_small_samples)
      | test(=printed_code_agrees_on_a_derived_in_over_a_null_int)
      | test(=printed_code_computes_the_derived_columns)
      | test(=printed_code_writes_null_to_nullable_enum_and_bool_columns)
      | test(=printed_code_agrees_on_the_use_case_vocabulary)))
  | (binary_id(rdra-ish-cli::codegen_builds) & (test(=go_builds) | test(=rust_builds) | test(=typescript_builds) | test(=rust_probes_name_every_contract) | test(=typescript_probes_name_every_contract)))
  | (binary_id(rdra-ish-cli::codegen_behaviour) & (test(=go_behaves) | test(=go_states_are_not_built_outside) | test(=rust_a_use_case_takes_the_capability_of_an_actor_that_performs_it) | test(=typescript_a_use_case_takes_the_capability_of_an_actor_that_performs_it) | test(=go_visitor_fails_to_compile_on_a_new_state) | test(=go_a_use_case_takes_the_capability_of_an_actor_that_performs_it)))
  | (binary_id(rdra-ish-cli::codegen_conformance) & test(=go_harness_tells_faults_apart))
  | (binary_id(rdra-ish-cli::codegen_commit) & (test(=go_service_commits_every_result_through_the_helper) | test(=commit_names_give_way_to_the_model)))
  | (binary_id(rdra-ish-cli::codegen_adapter) & (test(=go_adapter_tells_faults_apart) | test(=rust_adapters_build) | test(=go_adapters_build) | test(=typescript_adapters_build)))
  | (binary_id(rdra-ish-cli::codegen_code_build) & (test(=the_self_check_catches_a_service_that_ignores_the_id) | test(=a_model_adapter_conforms_whatever_the_domain_code_became) | test(=serde_derives_round_trip_a_row)))
  | (binary_id(rdra-ish-cli::codegen_code_build_ts) & (test(=the_self_check_catches_a_service_that_ignores_the_id) | test(=a_model_adapter_conforms_whatever_the_domain_code_became) | test(=each_fault_fails_the_run) | test(=each_omission_is_a_named_diagnostic)))
  | (binary_id(rdra-ish-cli::codegen_code_check_go) & (
        test(=the_probe_of_every_sample_compiles)
      | test(=a_prepare_takes_the_caller_of_its_use_case)
      | test(=each_fault_fails_the_conformance_run)
      | test(=a_build_command_in_rdra_toml_replaces_the_default)
      | test(=each_planted_omission_is_named)
      | test(=the_probe_names_the_domain_package_by_its_package_clause)
      | test(=the_reference_service_builds_and_conforms)
      | test(=the_self_check_catches_a_service_that_ignores_the_id)
      | test(=a_model_adapter_conforms_whatever_the_domain_code_became)
      | test(=a_service_embedding_the_unimplemented_port_builds_and_its_calls_are_reported)))
  | (binary_id(rdra-ish-cli::memory_cli) & (
        test(=shared_quotients_stop_no_cone_elsewhere_on_any_number_of_threads)
      | test(=the_generators_finish_a_cone_check_finishes)
      | test(=cones_side_by_side_stop_where_they_stop_one_at_a_time)
      | test(=verify_sizes_and_queues_tlc_runs_to_fit_the_memory)
      | test(=verify_leaves_a_cone_past_its_bfs_share_undecided)
      | test(=a_stopped_entity_cone_leaves_its_room_on_any_number_of_threads)
      | test(=safety_and_property_passes_stop_where_they_stop_one_at_a_time)))
  | (binary_id(rdra-ish-cli::guards_cli) & test(=oidc_auth_readme_rules_table_is_what_the_report_finds))
  | (binary_id(rdra-ish-cli::check_cli) & test(=check_defaults_to_a_pattern_cap_that_follows_the_instance_count_and_no_state_cap))
  | (binary_id(rdra-ish-cli::verify_cli) & (
        test(=a_safety_cone_stops_once_every_check_on_it_has_failed)
      | test(=a_safety_cone_shared_with_an_entity_cone_counts_the_whole_cone)
      | test(=liveness_is_decided_without_tlc_and_tlc_agrees)
      | test(=verify_reports_every_rule_that_fails_in_the_same_state)
      | test(=a_native_verify_decides_the_safety_checks_without_tlc)
      | test(=a_rerun_cfg_named_like_a_property_module_leaves_that_cfg)
      | test(=symmetry_always_decides_entity_cones_the_memory_limit_stopped_at_any_jobs)))
  | (binary_id(rdra-ish-cli::engine_corpus) & test(=a_capped_graph_decides_nothing_the_full_graph_contradicts))
  | (binary_id(rdra-ish-cli::engine_equivalence) & (
        test(=a_job_past_the_time_limit_runs_as_a_process_and_is_no_fault)
      | test(=a_job_that_exits_the_batch_jvm_runs_as_a_process)
      | test(=a_tlc_the_batch_driver_cannot_call_runs_as_a_process)))
  | (binary_id(rdra-ish-cli::key_facts) & test(=key_facts_hold_on_every_sample))
  | (binary_id(rdra-ish-lsp::manifest_error) & test(=a_burst_of_edits_ends_on_the_diagnostics_of_the_last_text))
  | (binary_id(rdra-ish-lsp::lifecycle_check) & test(=a_burst_of_edits_ends_on_the_findings_of_the_last_text))
  | (binary_id(rdra-ish-syntax::fmt_samples) & test(=fmt_keeps_every_sample_the_same_model_and_is_idempotent))
  | (binary_id(rdra-ish-core) & (
        test(=lifecycle::explore::tests::a_run_is_the_same_on_any_number_of_threads)
      | test(=lifecycle::explore::tests::a_run_stops_at_the_memory_limit_at_the_same_state_on_any_number_of_threads)
      | test(=lifecycle::explore::tests::a_run_stops_once_every_check_has_failed)
      | test(=lifecycle::explore::tests::store_bytes_models_the_store_a_run_counts)
      | test(=lifecycle::explore::plan_tests::planned_enabled_bindings_agree_with_eval_on_every_shipped_model)
      | test(=lifecycle::explore::symmetry::tests::a_parent_and_an_owner_child)
      | test(=lifecycle::explore::symmetry::witnesses::past_the_branch_cap_the_verdict_stands)
      | test(=lifecycle::tests::reduce::a_count_over_t_in_a_guard_reduces_exactly)
      | test(=lifecycle::tests::reduce::a_sub_lifecycle_that_reads_inputs_of_t_is_reduced_and_decides_the_same)
      | test(=lifecycle::tests::reduce::a_cone_between_the_old_and_the_new_cell_budget_is_reduced)
      | test(=lifecycle::tests::reduce::a_stopped_entity_cone_leaves_its_room_to_the_cones_after_it)
      | test(=lifecycle::tests::reduce::an_entity_cone_up_to_symmetry_decides_what_its_plain_run_left_open)))
  | (binary_id(rdra-ish-cli) & test(=verify::bfs::tests::tlc_reads_no_stopped_entity_cone))
  | (binary_id(rdra-ish-emit) & test(=codegen::tests::every_choice_a_function_is_named_for_is_chosen))
  | (binary_id(rdra-ish-cli::proof_equivalence) & test(=a_refuted_rule_left_out_changes_no_other_verdict))
  | (binary_id(rdra-ish-cli::proof_equivalence) & test(=a_certificate_is_reused_only_when_it_rechecks_and_changes_no_proof))
  | (binary_id(rdra-ish-cli::prove_cli) & test(=insurance_claim_ops_is_proved_without_its_lemma))
  | (binary_id(rdra-ish-cli::proof_equivalence) & test(=the_headroom_check_fails_when_a_check_runs_out))
)
"""
# Every failure, not only the first, and the slow tests again at the end of the log.
fail-fast = false
final-status-level = "slow"

[profile.pr.junit]
# target/nextest/pr/junit.xml: each test's time, which scripts/check-test-times.py reads.
path = "junit.xml"

[profile.slow]
# The tests the list above names, on main: `diff-test.sh --profile slow --filter 'not
# default()' --nextest-only`, `default()` being the `pr` filter this profile inherits. A profile of its own
# so that its times go to target/nextest/slow/junit.xml beside the `pr` run's.
inherits = "pr"

[profile.slow.junit]
path = "junit.xml"
