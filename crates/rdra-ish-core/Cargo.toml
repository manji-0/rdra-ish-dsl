[package]
name = "rdra-ish-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[features]
# Each fast function that has a reference twin also runs the twin and panics, naming the call,
# when the two differ (#275). For a checking run over the samples and the corpus; a release
# build leaves it off.
shadow = []
# A line per pass of `verify` and per BFS run on stderr under `RDRA_PERF=1`, for measuring
# (#296, `src/perf.rs`); a release build leaves it off.
perf = []

[dependencies]
rdra-ish-syntax = { path = "../rdra-ish-syntax" }
miette      = { workspace = true }
thiserror   = { workspace = true }
slotmap     = { workspace = true }
petgraph    = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
dunce       = { workspace = true }
walkdir     = { workspace = true }
toml        = { workspace = true }
hashbrown   = { workspace = true }

[dev-dependencies]
insta    = { workspace = true }
tempfile = { workspace = true }
rdra-ish-emit = { path = "../rdra-ish-emit" }

# `#[cfg(kani)]` marks the Kani harnesses (docs/engine-agreement.md#kani-harnesses).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
