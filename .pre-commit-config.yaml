# Each commit runs fmt, clippy, and the tests of the crates it touches, inside
# `nix develop` so the codegen tests use the flake's Go. CI runs the whole workspace.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '(^out\.mmd$|^samples/.*/out/|^crates/.*/src/snapshots/.*\.snap$)'
      - id: end-of-file-fixer
        exclude: '(^out\.mmd$|^samples/.*/out/|^crates/.*/src/snapshots/.*\.snap$)'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-test
        name: cargo test (crates the commit touches)
        entry: nix develop --command scripts/diff-test.sh
        language: system
        files: '^(crates/.*|Cargo\.(toml|lock))$'
