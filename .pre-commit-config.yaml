# `pre-commit install` installs both hooks: fmt and clippy on each commit, the test
# suite once per push. The tests run inside `nix develop`, so the Go and Java the codegen
# and TLC tests call are the flake's.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '(^out\.mmd$|^samples/.*/out/|^crates/.*/src/snapshots/.*\.snap$)'
      - id: end-of-file-fixer
        exclude: '(^out\.mmd$|^samples/.*/out/|^crates/.*/src/snapshots/.*\.snap$)'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-test
        name: cargo test
        entry: nix develop --command cargo test --all
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-push]
